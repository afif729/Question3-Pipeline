apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-app-deployment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: advanced-app
  template:
    metadata:
      labels:
        app: advanced-app
    spec:
      containers:
        - name: advanced-app
          image: afif729/advanced-app:v1.0
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: advanced-app-service
spec:
  type: NodePort
  selector:
    app: advanced-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
